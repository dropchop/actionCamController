<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Larkfly Controller</title>
<style>
  :root {
    --bg: #111;
    --panel: #1c1c1c;
    --panel-2: #252525;
    --text: #eee;
    --muted: #888;
    --accent: #5fb;
    --warn: #fa3;
    --err: #f55;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family:
          ui-monospace, "SF Mono", Menlo, monospace; }
  header { padding: 12px 16px; background: var(--panel); display: flex; align-items: center; gap: 18px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 500; letter-spacing: 0.04em; }
  header .controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid #444;
    padding: 6px 14px; font: inherit; cursor: pointer; border-radius: 3px;
    transition: background 0.1s;
  }
  button:hover:not(:disabled) { background: #353535; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #2a6; border-color: #3a7; }
  button.primary:hover { background: #3b7; }
  button.danger { background: #a33; border-color: #b44; }
  button.danger:hover { background: #b44; }

  #grid {
    display: grid; padding: 12px; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  }
  .slot {
    background: var(--panel); border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 320px;
  }
  .slot-header {
    padding: 8px 12px; display: flex; align-items: center; gap: 12px;
    background: var(--panel-2); border-bottom: 1px solid #333;
  }
  .slot-title { font-weight: 500; }
  .slot-meta { font-size: 11px; color: var(--muted); }
  .slot-state { font-size: 11px; padding: 2px 8px; border-radius: 10px;
                background: #333; }
  .slot-state.running { background: #1e5; color: #042; }
  .slot-state.reconnecting { background: var(--warn); color: #210; }
  .slot-state.dead { background: var(--err); color: #200; }

  .slot img {
    width: 100%; height: auto; min-height: 200px; background: #000;
    display: block;
  }
  .slot-foot {
    padding: 8px 12px; display: flex; gap: 8px; align-items: center;
    background: var(--panel-2); border-top: 1px solid #333;
  }
  .recording-pill {
    background: #d33; color: #fff; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0.55; } }

  #burst-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 16px;
    background: var(--panel-2); border-top: 1px solid #333; display: none;
  }
  #burst-bar.active { display: block; }
  #burst-progress { background: #444; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #burst-progress-fill { background: var(--err); height: 100%; width: 0%;
                          transition: width 100ms linear; }
</style>
</head>
<body>

<header>
  <h1>LARKFLY CONTROLLER</h1>
  <div class="controls">
    <button onclick="postBurst(1)">Burst 1s</button>
    <button onclick="postBurst(3)">Burst 3s</button>
    <button onclick="postBurst(5)">Burst 5s</button>
    <button class="primary" onclick="post('/api/record/start')">Record</button>
    <button class="danger" onclick="post('/api/record/stop')">Stop</button>
    <button onclick="post('/api/capture')">Photo</button>
  </div>
</header>

<div id="grid">
  {% for i in range(n_slots) %}
  <div class="slot" id="slot-{{i}}">
    <div class="slot-header">
      <span class="slot-title">cam{{i}}</span>
      <span class="slot-meta" id="meta-{{i}}">…</span>
      <span class="slot-state" id="state-{{i}}">connecting</span>
    </div>
    <img src="/video_feed/{{i}}" alt="cam {{i}} preview">
    <div class="slot-foot">
      <span id="fps-{{i}}" class="slot-meta">— fps</span>
      <span id="rec-{{i}}"></span>
    </div>
  </div>
  {% else %}
  <div class="slot"><div class="slot-header">No cameras configured</div></div>
  {% endfor %}
</div>

<div id="burst-bar">
  <span id="burst-label">Burst recording…</span>
  <div id="burst-progress"><div id="burst-progress-fill"></div></div>
</div>

<script>
async function post(url, body = null) {
  const r = await fetch(url, {
    method: 'POST',
    headers: body ? {'Content-Type': 'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json().catch(() => null);
}
function postBurst(secs) {
  return post('/api/burst', {duration: secs});
}

async function refresh() {
  try {
    const r = await fetch('/api/status');
    const j = await r.json();
    j.slots.forEach(s => {
      const meta = document.getElementById(`meta-${s.slot}`);
      if (meta) meta.textContent = `${s.host} · ${s.model || '?'} · fw ${s.firmware || '?'} · ${s.mode_name}`;
      const state = document.getElementById(`state-${s.slot}`);
      if (state) {
        state.textContent = s.state;
        state.className = `slot-state ${s.state}`;
      }
      const fps = document.getElementById(`fps-${s.slot}`);
      if (fps) fps.textContent = `${s.fps_actual || 0} fps · last frame ${s.last_frame_age_s ?? '—'}s ago`;
      const rec = document.getElementById(`rec-${s.slot}`);
      if (rec) rec.innerHTML = s.recording ? '<span class="recording-pill">● REC</span>' : '';
    });

    // Burst progress bar
    const bar = document.getElementById('burst-bar');
    const fill = document.getElementById('burst-progress-fill');
    const lbl = document.getElementById('burst-label');
    if (j.burst.active) {
      bar.classList.add('active');
      const pct = Math.min(100, (j.burst.elapsed_s / j.burst.duration_s) * 100);
      fill.style.width = `${pct}%`;
      const remaining = Math.max(0, j.burst.duration_s - j.burst.elapsed_s).toFixed(1);
      lbl.textContent = `Burst recording — ${remaining}s remaining`;
    } else {
      bar.classList.remove('active');
    }
  } catch (e) {
    console.error(e);
  }
}
setInterval(refresh, 500);
refresh();
</script>
</body>
</html>
